name: Main CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:

concurrency:
  group: main-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  verify:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            frontend/node_modules
            ~/.local/share/mise/
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-yams-${{ hashFiles('mise.toml', 'rust-toolchain.toml', 'frontend/package-lock.json') }}

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_key: mise-v1-{{platform}}-{{file_hash}}

      - name: Check formatting and linting
        run: mise run check

      - name: Run tests
        run: mise run test

  smoke-build:
    name: Smoke build
    needs: verify
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            frontend/node_modules
            ~/.local/share/mise/
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-yams-${{ hashFiles('mise.toml', 'rust-toolchain.toml', 'frontend/package-lock.json') }}

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_key: mise-v1-{{platform}}-{{file_hash}}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libappindicator3-dev librsvg2-dev patchelf

      - name: Smoke build
        run: mise run build
