name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  main-ci:
    name: Main CI gate
    uses: ./.github/workflows/main_ci.yml

  release:
    name: Release for all platforms
    needs: [main-ci]
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            frontend/node_modules
            ~/.local/share/mise/
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-yams-${{ hashFiles('mise.toml', 'rust-toolchain.toml', 'frontend/package-lock.json') }}

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_key: mise-v1-{{platform}}-{{file_hash}}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev gdk-pixbuf2.0-dev webkit2gtk-4.0 libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev pkg-config libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "YAMS - v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          projectPath: frontend
          tauriScript: "mise run"
          iconPath: resources/logos/yams.png

      - name: Build backend binaries
        run: mise run build:server build:scheduler

      - name: Upload backend binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -f target/release/yams-server.exe ]; then
            gh release upload "${GITHUB_REF_NAME}" \
              "target/release/yams-server.exe#yams-server-windows-x64.exe" \
              "target/release/yams-scheduler.exe#yams-scheduler-windows-x64.exe" \
              --clobber
          else
            gh release upload "${GITHUB_REF_NAME}" \
              "target/release/yams-server#yams-server-linux-x64" \
              "target/release/yams-scheduler#yams-scheduler-linux-x64" \
              --clobber
          fi
