[package]
name = "yams-api"
version = "0.1.0"
edition = "2024"

[dependencies]
yams-core = { path = "../core" }
poem-openapi = { version = "5.0", features = ["uuid", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["serde"] }
chrono = { version = "0.4.43", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0.101"
async-trait = "0.1.89"

