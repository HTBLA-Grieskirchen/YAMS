[package]
name = "yams-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
rust_decimal = { version = "1.0", features = ["serde"] }
anyhow = "1.0.100"
fxhash = "0.2.1"
async-trait = "0.1.89"

[dev-dependencies]
pollster = { version = "0.4.0", features = ["macro"] }

