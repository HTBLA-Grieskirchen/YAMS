[package]
name = "yams-persistence"
version = "0.1.0"
edition = "2024"

[dependencies]
yams-core = { path = "../core" }
molting = { path = "../molting" }
libsql = "0.9"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
rust_decimal = { version = "1.0", features = ["serde"] }
anyhow = "1.0.100"
