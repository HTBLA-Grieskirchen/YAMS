cargo-features = ["profile-rustflags", "trim-paths"]

[package]
name = "yams-tauri"
description = "A management software for patients and animals"
default-run = "yams-tauri"
version.workspace = true
authors.workspace = true
license-file.workspace = true
edition.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "^2.0", default-features = false, features = ["config-toml"] }

[dependencies]
yams-core = { path = "../../crates/yams-core" }
yams-sqlite = { path = "../../crates/yams-sqlite" }
yams-api = { path = "../../crates/yams-api", default-features = false, features = ["serde"] }
yams-filesystemstore = { path = "../../crates/yams-filesystemstore" }
yams-typstreports = { path = "../../crates/yams-typstreports" }
yams-scheduler = { path = "../../backend/scheduler", default-features = false }

thiserror = { workspace = true}
error-stack = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = "0.1"

tauri = { version = "2.11.0", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.0"
url = { version = "^2.3.1", features = ["serde"] }
directories = "6.0.0"

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
test-log = { workspace = true }
