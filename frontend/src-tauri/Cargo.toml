[package]
name = "yams"
description = "A management software for patients and animals"
default-run = "yams"
version.workspace = true
authors.workspace = true
license-file.workspace = true
edition.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "^2.0", features = [] }

[dependencies]
yams-core = { path = "../../crates/yams-core" }
yams-persistence = { path = "../../crates/yams-persistence" }
yams-api = { path = "../../crates/yams-api", default-features = false, features = ["serde"] }
yams-filesystemstore = { path = "../../crates/yams-filesystemstore" }
yams-typstreports = { path = "../../crates/yams-typstreports" }

thiserror = { workspace = true}
error-stack = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

tauri = { version = "2.11.0", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.0"
url = { version = "^2.3.1", features = ["serde"] }
directories = "6.0.0"
