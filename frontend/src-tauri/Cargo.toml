[package]
name = "yams"
version = "0.1.0"
description = "A management software for patients and animals"
authors = ["Tim Peko", "David Rathmair", "Dominik Wernsdorfer", "Julian Bachinger", "David Edthaler", "Daniel Ferihumer"]
license-file = "../../LICENSE"
repository = "https://github.com/HTBLA-Grieskirchen/YAMS/"
default-run = "yams"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "^1.0"
serde = { version = "^1.0", features = ["derive"] }
yams-core = { path = "../../backend/core" }
yams-persistence = { path = "../../backend/persistence" }
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
url = { version = "^2.3.1", features = ["serde"] }
surrealdb = { version = "1.0", features = ["kv-rocksdb"] }
directories = "^4.0.1"

[features]
