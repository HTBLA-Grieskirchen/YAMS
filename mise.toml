[tools]
node = "22"
rust = "latest"

[tasks."frontend:install"]
description = "Install frontend dependencies"
dir = "frontend"
run = "npm install"

[tasks."frontend:dev"]
description = "Start Next.js dev server"
dir = "frontend"
run = "npm run dev"

[tasks."frontend:build"]
description = "Build Next.js app"
dir = "frontend"
run = "npm run build"

[tasks."frontend:lint"]
description = "Lint frontend"
dir = "frontend"
run = "npm run lint"

[tasks."frontend:generate-types"]
description = "Generate TypeScript types from OpenAPI spec"
dir = "frontend"
run = "npx openapi-typescript ../openapi.json -o src/api/schema.d.ts"

[tasks."backend:check"]
description = "Check all backend crates"
run = "cargo check"

[tasks."backend:test"]
description = "Run all backend tests"
run = "cargo test"

[tasks."backend:export-spec"]
description = "Export OpenAPI spec to openapi.json"
run = "cargo run -p yams-dto --bin export_spec > openapi.json"

[tasks."tauri:dev"]
description = "Start Tauri dev"
dir = "frontend"
run = "npx tauri dev"

[tasks."tauri:build"]
description = "Build Tauri app"
dir = "frontend"
run = "npx tauri build"

[tasks.dev]
description = "Start dev environment"
depends = ["frontend:dev"]

[tasks.build]
description = "Build the whole project"
depends = ["backend:export-spec", "frontend:generate-types", "frontend:build", "tauri:build"]

[tasks.test]
description = "Run all tests"
depends = ["backend:test", "frontend:test"]
