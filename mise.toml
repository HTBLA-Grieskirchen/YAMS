[settings]
idiomatic_version_file_enable_tools = ["rust"]
jobs = 1

[tools]
node = "22"
"pipx:graphifyy" = "latest"
"npm:diffx-cli" = "latest"
"cargo:cargo-nextest" = "latest"

[vars]
REPO_ROOT = "{{config_root}}"

[task_config]
includes = [
    "tasks/format.toml",
    "tasks/linting.toml",
    "tasks/check.toml",
    "tasks/fixes.toml",
    "tasks/tests.toml",
    "tasks/dev.toml",
    "tasks/misc.toml",
    "tasks/build.toml"
]


[tasks."build:tauri"]
description = "Build Tauri app"
depends = ["build:frontend"]
dir = "{{ vars.REPO_ROOT }}/frontend"
run = "npx tauri build"
