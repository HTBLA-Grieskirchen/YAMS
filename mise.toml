[settings]
idiomatic_version_file_enable_tools = ["rust"]
jobs = 1

[tools]
node = "22"

[env]
FRONTEND_DIR = "frontend"
OPENAPI_SPEC = "openapi.json"
DATABASE_URL = "{{ config_root }}/sqlite.local/yams.db"

[task_config]
includes = [
    "tasks/format.toml",
    "tasks/linting.toml",
    "tasks/check.toml",
    "tasks/fixes.toml",
    "tasks/tests.toml",
    "tasks/dev.toml",
    "tasks/misc.toml",
    "tasks/build.toml"
]


[tasks."build:tauri"]
description = "Build Tauri app"
depends = ["build:frontend"]
dir = "{{env.FRONTEND_DIR}}"
run = "npx tauri build"

[tasks."test:backend"]
description = "Run all backend tests"
run = "cargo test"

[tasks."test:frontend"]
description = "Run frontend tests"
dir = "{{env.FRONTEND_DIR}}"
run = "npm run test"

[tasks.test]
description = "Run all tests"
depends = ["test:backend", "test:frontend"]

