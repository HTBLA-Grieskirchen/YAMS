[env]
FRONTEND_DIR = "frontend"
OPENAPI_SPEC = "openapi.json"

[tools]
node = "22"
rust = "nightly"

[tasks."build:openapi"]
description = "Export OpenAPI spec to openapi.json"
run = "cargo run -p yams-dto --bin export_spec > $OPENAPI_SPEC"

[tasks."generate:types"]
description = "Generate TypeScript types from OpenAPI spec"
depends = ["build:openapi"]
dir = "{{env.FRONTEND_DIR}}"
run = "npx openapi-typescript ../$OPENAPI_SPEC -o src/api/schema.d.ts"

[tasks."build:frontend"]
description = "Build Next.js app"
depends = ["generate:types"]
dir = "{{env.FRONTEND_DIR}}"
run = "npm run build"

[tasks."build:tauri"]
description = "Build Tauri app"
depends = ["build:frontend"]
dir = "{{env.FRONTEND_DIR}}"
run = "npx tauri build"

[tasks."check:backend"]
description = "Check all backend crates"
run = "cargo check"

[tasks."test:backend"]
description = "Run all backend tests"
run = "cargo test"

[tasks."test:frontend"]
description = "Run frontend tests"
dir = "{{env.FRONTEND_DIR}}"
run = "npm run test"

[tasks."lint:frontend"]
description = "Lint frontend"
dir = "{{env.FRONTEND_DIR}}"
run = "npm run lint"

[tasks."dev:frontend"]
description = "Start Next.js dev server"
dir = "{{env.FRONTEND_DIR}}"
run = "npm run dev"

[tasks."dev:tauri_"]
dir = "{{env.FRONTEND_DIR}}"
env = {"YAMS_DEV"="1"}
run = "npx tauri dev"

[tasks."dev:tauri"]
description = "Start Tauri dev"
dir = "{{env.FRONTEND_DIR}}"
run = [
    {tasks = ["dev:tauri_", "dev:frontend"]}
]

[tasks.dev]
description = "Start dev environment"
depends = ["dev:frontend"]

[tasks.build]
description = "Build the whole project"
depends = ["build:tauri"]

[tasks.test]
description = "Run all tests"
depends = ["test:backend", "test:frontend"]

[tasks.ci]
description = "CI pipeline task"
depends = ["check:backend", "lint:frontend", "test"]
