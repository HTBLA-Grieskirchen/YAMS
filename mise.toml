[env]
FRONTEND_DIR = "frontend"
OPENAPI_SPEC = "openapi.json"
DATABASE_URL = "{{ config_root }}/sqlite.local/yams.db"

[tools]
node = "22"
prettier = "latest"
rust = "nightly"


[tasks."export:openapi"]
description = "Export OpenAPI spec to stdout"
raw = true
run = "cargo run -p yams-dto --bin export_spec"

[tasks."build:openapi"]
description = "Sync OpenAPI spec from backend to frontend"
dir = "{{env.FRONTEND_DIR}}"
run = "mise run export:openapi | npx openapi-typescript -o src/api/schema.d.ts --enum-values --empty-objects-unknown "

[tasks."build:frontend"]
description = "Build Next.js app"
depends = ["build:openapi"]
dir = "{{env.FRONTEND_DIR}}"
run = "npm run build"

[tasks."build:tauri"]
description = "Build Tauri app"
depends = ["build:frontend"]
dir = "{{env.FRONTEND_DIR}}"
run = "npx tauri build"

[tasks."check:backend"]
description = "Check all backend crates"
run = "cargo check"

[tasks."test:backend"]
description = "Run all backend tests"
run = "cargo test"

[tasks."test:frontend"]
description = "Run frontend tests"
dir = "{{env.FRONTEND_DIR}}"
run = "npm run test"

[tasks."lint:frontend"]
description = "Lint frontend"
dir = "{{env.FRONTEND_DIR}}"
run = "npm run lint"

[tasks."dev:frontend"]
description = "Start Next.js dev server"
dir = "{{env.FRONTEND_DIR}}"
run = "npm run dev"

[tasks."dev:tauri_"]
dir = "{{env.FRONTEND_DIR}}"
env = {"YAMS_DEV"="1"}
run = "npx tauri dev"

[tasks."dev:tauri"]
description = "Start Tauri dev"
dir = "{{env.FRONTEND_DIR}}"
run = [
    {tasks = ["dev:tauri_", "dev:frontend"]}
]

[tasks."fmt:web"]
description = "Format the web code"
usage = """
flag "--check" env="YAMS_FMT_CHECK" help="Only performs a check of the formatting"
"""
run = """
#!/usr/bin/env bash
PRETTIER_CMD=$([ "${usage_check:-}" = "true" ] && echo "--check" || echo "--write")
prettier $PRETTIER_CMD . --ignore-path .gitignore --ignore-path frontend/.gitignore --ignore-path frontend/src-tauri/.gitignore
"""

[tasks."fmt:rust"]
description = "Format the rust code"
usage = """
flag "--check" env="YAMS_FMT_CHECK" help="Only performs a check of the formatting"
"""
run = """
#!/usr/bin/env bash
FMT_CMD=$([ "${usage_check:-}" = "true" ] && echo "--check")
cargo fmt --all $FMT_CMD
"""

[tasks.fmt]
description = "Format all the code"
usage = """
flag "--check" env="YAMS_FMT_CHECK" help="Only performs a check of the formatting"
"""
run = 'mise run fmt:?*'

[tasks.dev]
description = "Start dev environment"
depends = ["dev:frontend"]

[tasks."dev:server"]
description = "Start backend dev server"
run = "cargo run -p yams-server"

[tasks.build]
description = "Build the whole project"
depends = ["build:tauri"]

[tasks.test]
description = "Run all tests"
depends = ["test:backend", "test:frontend"]

[tasks.ci]
description = "CI pipeline task"
depends = ["check:backend", "lint:frontend", "test"]
