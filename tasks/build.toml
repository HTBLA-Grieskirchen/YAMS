#:schema https://mise.jdx.dev/schema/mise-task.json

["build:server"]
description = "Build the standalone backend server binary"
run = "cargo build -p yams-server --release"

["build:scheduler"]
description = "Build the standalone scheduler daemon binary"
run = "cargo build -p yams-scheduler --release"

["build:frontend"]
description = "Build the Next.js frontend"
dir = "{{ vars.REPO_ROOT }}/frontend"
depends = ["sync:openapi"]
run = "npm run build"

["build:tauri"]
description = "Build Tauri app"
dir = "{{ vars.REPO_ROOT }}/frontend"
depends = ["build:frontend"]
run = "npm run tauri build"

[build]
description = "Builds whole project"
depends = ["build:{server,scheduler,tauri}"]
