#:schema https://mise.jdx.dev/schema/mise-task.json

["dev:server"]
description = "Start backend dev server (default :3000/api)"
run = "cargo run -p yams-server"

["dev:frontend"]
description = "Start Next.js dev server"
dir = "{{env.FRONTEND_DIR}}"
run = "npm run dev"

["dev:frontend-remote"]
hide = true
description = "Next.js on :3001 (pair with dev:server on :3000)"
dir = "{{env.FRONTEND_DIR}}"
run = "npm run dev -- --port 3001"

["dev:tauri_"]
hide = true
dir = "{{env.FRONTEND_DIR}}"
env.YAMS_DEV = "1"
run = "npm run tauri dev"

["dev:tauri"]
description = "Start Tauri dev"
dir = "{{env.FRONTEND_DIR}}"
run = [
    {tasks = ["dev:tauri_", "dev:frontend"]}
]

# TODO: implement all these variants
["dev:tauri+server"]
description = "Start Tauri dev with standalone backend dev server"
env.YAMS_DEV = "1"
depends = ["tmp:print-env"]

["dev:frontend+server"]
description = "Next.js (:3001) + yams-server (:3000/api)"
depends = ["dev:server", "dev:frontend-remote"]
env.NEXT_PUBLIC_YAMS_API_URL = "http://127.0.0.1:3000/api"

["dev:tauri+embedded"]
description = "Start Tauri dev with embedded backend"
env.YAMS_DEV = "1"
run = [{task = "tmp:print-env"}]

["tmp:print-env"]
description = "Print the environment variables"
run = "env"

